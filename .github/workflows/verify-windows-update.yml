name: Verify Windows update
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Published starting release for an online UI test (leave empty for the staged upgrade)
        type: string
        required: false
  push:
    branches:
      - 'codex/verify-windows-update/**'

permissions:
  contents: read

jobs:
  upgrade:
    if: ${{ !inputs.from_tag }}
    permissions:
      # GitHub only exposes draft releases to identities with repository push access.
      # The token is passed only to the fetch step.
      contents: write
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Windows process selection and update controller
        run: node --test test/windows-installer.test.cjs test/app-update.test.cjs
      - name: Fetch staged installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $result = gh release view $tag --json isDraft,assets --jq '{draft:.isDraft,assets:[.assets[]|{name,size,digest}]}'
          if ($LASTEXITCODE) { throw "Could not read the staged release" }
          $result | Set-Content "$env:RUNNER_TEMP/offer.json" -Encoding utf8
          $release = $result | ConvertFrom-Json
          if (!$release.draft) { throw "The candidate must still be a draft" }
          $base = @($release.assets | Where-Object name -Match '^test-from-[\d.]+-win-x64\.exe$')
          $target = @($release.assets | Where-Object name -EQ "-$version-win-x64.exe")
          if ($base.Count -ne 1 -or $target.Count -ne 1) { throw "Missing or ambiguous staged installer" }
          gh release download $tag --pattern $base[0].name --output "$env:RUNNER_TEMP/base.exe"
          if ($LASTEXITCODE) { throw "Could not download the baseline installer" }
          gh release download $tag --pattern $target[0].name --output "$env:RUNNER_TEMP/candidate.exe"
          if ($LASTEXITCODE) { throw "Could not download the candidate" }
      - name: Upgrade the installed application with a residual process
        shell: pwsh
        run: node scripts/smoke-windows-update.cjs "$env:RUNNER_TEMP/offer.json" "$env:RUNNER_TEMP/base.exe" "$env:RUNNER_TEMP/candidate.exe"

  published:
    if: ${{ inputs.from_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the published starting version
        shell: pwsh
        env:
          START_TAG: ${{ inputs.from_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:START_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag" }
          $result = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:START_TAG"
          if ($LASTEXITCODE) { throw "Starting release unavailable" }
          $result | Set-Content "$env:RUNNER_TEMP/base.json" -Encoding utf8
          $name = "-" + $env:START_TAG.Substring(1) + "-win-x64.exe"
          gh release download $env:START_TAG --pattern $name --output "$env:RUNNER_TEMP/base.exe"
          if ($LASTEXITCODE) { throw "Starting installer unavailable" }
      - name: Check, download and restart through the installed Windows UI
        shell: pwsh
        run: node scripts/smoke-windows-update.cjs "$env:RUNNER_TEMP/base.json" "$env:RUNNER_TEMP/base.exe"
