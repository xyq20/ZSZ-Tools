name: Verify desktop updates
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Published starting release for an online UI test (leave empty for the staged upgrade)
        type: string
        required: false
  push:
    branches:
      - 'codex/verify-windows-update/**'

permissions:
  contents: read

jobs:
  upgrade:
    if: ${{ !inputs.from_tag }}
    permissions:
      # GitHub only exposes draft releases to identities with repository push access.
      # The token is passed only to the fetch step.
      contents: write
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Windows process selection and update controller
        run: node --test test/windows-installer.test.cjs test/app-update.test.cjs
      - name: Fetch staged installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $result = gh release view $tag --json isDraft,assets --jq '{draft:.isDraft,assets:[.assets[]|{name,size,digest}]}'
          if ($LASTEXITCODE) { throw "Could not read the staged release" }
          $release = $result | ConvertFrom-Json
          if (!$release.draft) { throw "The candidate must still be a draft" }
          $prior = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -or $prior.tag_name -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Starting release unavailable" }
          $from = $Matches[1]
          $baseline = @($prior.assets | Where-Object name -EQ "-$from-win-x64.exe")
          $target = @($release.assets | Where-Object name -EQ "-$version-win-x64.exe")
          if ($baseline.Count -ne 1 -or $target.Count -ne 1) { throw "Missing or ambiguous installer" }
          $release.assets += [pscustomobject]@{name="test-from-$from-win-x64.exe";size=$baseline[0].size;digest=$baseline[0].digest}
          $release | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP/offer.json" -Encoding utf8
          gh release download $prior.tag_name --pattern $baseline[0].name --output "$env:RUNNER_TEMP/base.exe"
          if ($LASTEXITCODE) { throw "Could not download the published baseline" }
          gh release download $tag --pattern $target[0].name --output "$env:RUNNER_TEMP/candidate.exe"
          if ($LASTEXITCODE) { throw "Could not download the candidate" }
      - name: Upgrade the installed application with a residual process
        shell: pwsh
        run: node scripts/smoke-windows-update.cjs "$env:RUNNER_TEMP/offer.json" "$env:RUNNER_TEMP/base.exe" "$env:RUNNER_TEMP/candidate.exe"

  prepared:
    if: ${{ !inputs.from_tag }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify rollback with the native helper
        run: python -B test/hot_update_test.py
      - name: Fetch the exact draft payload and the hot-capable starting fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $result = gh release view $tag --json isDraft,assets --jq '{isDraft,assets:[.assets[]|{name,size,digest}]}'
          if ($LASTEXITCODE) { throw "Draft lookup failed" }
          $offer = $result | ConvertFrom-Json
          if (!$offer.isDraft) { throw "Expected an unpublished candidate" }
          $result | Set-Content "$env:RUNNER_TEMP/hot-offer.json" -Encoding utf8
          $baseSuffix = if ($IsWindows) { "win-x64.exe" } else { "mac-arm64.dmg" }
          $suffix = if ($IsWindows) { "win-x64.zip" } else { $baseSuffix }
          $base = @($offer.assets | Where-Object name -Like "qa-start-*-$baseSuffix")
          if ($base.Count -ne 1) { throw "Missing or ambiguous starting fixture" }
          gh release download $tag --pattern $base[0].name --output "$env:RUNNER_TEMP/starting$([IO.Path]::GetExtension($baseSuffix))"
          if ($LASTEXITCODE) { throw "Could not fetch the starting fixture" }
          gh release download $tag --pattern "-$version-$suffix" --output "$env:RUNNER_TEMP/offered$([IO.Path]::GetExtension($suffix))"
          if ($LASTEXITCODE) { throw "Could not fetch the candidate" }
      - name: Measure prepared restart and verify the window and desktop entry
        run: node scripts/smoke-prepared-update.cjs

  published:
    if: ${{ inputs.from_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the published starting version
        shell: pwsh
        env:
          START_TAG: ${{ inputs.from_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:START_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag" }
          $result = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:START_TAG"
          if ($LASTEXITCODE) { throw "Starting release unavailable" }
          $result | Set-Content "$env:RUNNER_TEMP/base.json" -Encoding utf8
          $name = "-" + $env:START_TAG.Substring(1) + "-win-x64.exe"
          gh release download $env:START_TAG --pattern $name --output "$env:RUNNER_TEMP/base.exe"
          if ($LASTEXITCODE) { throw "Starting installer unavailable" }
      - name: Check, download and restart through the installed Windows UI
        shell: pwsh
        run: node scripts/smoke-windows-update.cjs "$env:RUNNER_TEMP/base.json" "$env:RUNNER_TEMP/base.exe"
